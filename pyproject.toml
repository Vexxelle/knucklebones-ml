[project]
name = "knucklebones_ml"
version = "0.1.0"
description = "Python implementation of Dice Game 'Knucklebones' from Cult of the Lamb"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blessed>=1.30.0",
    "numpy>=2.4.2",
    "pandas>=3.0.3",
    "pettingzoo>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]
examples = [
    "pandas>=3.0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D107", "D212", "FBT001", "FBT002", "T201", "TD002", "TD003", "RET504", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ANN001", "ANN201", "D100", "D103", "INP001", "PLR2004", "S101"]
"examples/**/*" = ["D", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["knucklebones_ml"]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]
strict = true
